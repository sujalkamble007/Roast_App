name: Roast App CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Verify All Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build & Test Backend Microservices (Maven)
        run: mvn -B clean verify

      - name: Build React Frontend (Vite)
        working-directory: ./web
        run: |
          npm ci
          npm run build

  deploy:
    name: Build & Deploy Container Images
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Gateway Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./gateway/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/roast-gateway:latest

      - name: Build and Push Roast Service Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./roast-service/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/roast-service:latest

      - name: Build and Push Identity Service Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./identity-service/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/roast-identity-service:latest

      - name: Build and Push Connector Service Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./connector-service/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/roast-connector-service:latest

      - name: Build and Push Share Service Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./share-service/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/roast-share-service:latest
