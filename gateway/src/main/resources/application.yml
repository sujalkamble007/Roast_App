server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: identity-auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**,/api/v1/me
        - id: roast-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/roasts/**
        - id: share-service
          uri: http://localhost:8084
          predicates:
            - Path=/s/**,/api/v1/public/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
