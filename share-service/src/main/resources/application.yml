server:
  port: 8084

spring:
  application:
    name: share-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 4
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    table: flyway_share_history
    baseline-on-migrate: true
    baseline-version: '0'

management:
  endpoints:
    web:
      exposure:
        include: health,info
