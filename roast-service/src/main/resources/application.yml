server:
  port: 8083

spring:
  application:
    name: roast-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 4
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

groq:
  api-keys: ${GROQ_API_KEYS:${GROQ_API_KEY}}
  model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  base-url: https://api.groq.com/openai/v1

roast:
  daily-limit: ${ROAST_DAILY_LIMIT:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
