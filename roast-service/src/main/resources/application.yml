server:
  port: 8083

spring:
  application:
    name: roast-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 4
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    table: flyway_roast_history
    baseline-on-migrate: true
    baseline-version: '0'
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

groq:
  api-keys: ${GROQ_API_KEYS:${GROQ_API_KEY}}
  model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  base-url: https://api.groq.com/openai/v1

roast:
  daily-limit: ${ROAST_DAILY_LIMIT:3}

connector:
  base-url: ${CONNECTOR_SERVICE_URL:${CONNECTOR_BASE_URL:http://localhost:8082}}

share:
  base-url: ${SHARE_SERVICE_URL:${SHARE_BASE_URL:http://localhost:8084}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
